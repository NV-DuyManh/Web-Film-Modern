<style>.animated-celestial-halo { transform-box: fill-box; transform-origin: center; animation: halo-pulse 5s ease-in-out infinite; } @keyframes halo-pulse { 0%,100% { transform: scale(1); opacity: .55; } 50% { transform: scale(1.3); opacity: 1; } } @media (prefers-reduced-motion: reduce) { .animated-celestial-halo { animation: none; } }</style><defs>
