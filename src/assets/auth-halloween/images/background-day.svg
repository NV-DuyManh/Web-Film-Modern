  <linearGradient id="valley-mist" x2="0" y2="1"><stop stop-color="#e4ecdf" stop-opacity=".19"/><stop offset=".5" stop-color="#e4ecdf" stop-opacity=".035"/><stop offset="1" stop-color="#e4ecdf" stop-opacity="0"/></linearGradient>
  <radialGradient id="celestial-halo"><stop stop-color="#ffe8b8" stop-opacity=".22"/><stop offset="1" stop-color="#ffe8b8" stop-opacity="0"/></radialGradient>
