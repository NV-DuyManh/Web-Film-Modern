<filter id="cloud-feather" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter>
<g id="cloud-puff" fill="url(#cloud-soft)" filter="url(#cloud-feather)"><path d="M20 69C-3 68-5 44 14 36c-1-22 21-34 40-25C68-12 106-6 118 16c19-12 44-1 46 19 18-7 38 1 42 16 13-8 36-2 36 11 24-2 35 7 28 17C231 90 57 91 20 69Z"/><path d="M44 44C61 31 84 33 98 40c12-11 34-13 48 1 24-3 40 4 43 13-52 13-109 6-145-10Z" opacity=".28"/></g></defs><style>.cloud-drift { animation: cloud-float 26s ease-in-out infinite alternate; } .cloud-drift.slow { animation-duration: 37s; animation-delay: -13s; } .cloud-drift.far { animation-duration: 31s; animation-delay: -8s; } @keyframes cloud-float { from { transform: translate(-14px, 3px); } to { transform: translate(24px, -7px); } } @media (prefers-reduced-motion: reduce) { .cloud-drift { animation: none; } }</style>
