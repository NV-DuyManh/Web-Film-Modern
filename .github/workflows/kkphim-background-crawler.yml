name: KKPhim Background Crawler

on:
  schedule:
    # Resume the admin queue first, then the once-daily discovery queue.
    - cron: '7-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    env:
      CLOUD_WORKER_TOKEN: ${{ secrets.CLOUD_WORKER_TOKEN }}
      SECURE_ACCOUNTS_ENABLED: ${{ vars.SECURE_ACCOUNTS_ENABLED }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: episode-cloud-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Continue requested crawl
        id: crawl
        run: node scripts/crawlKkphim.mjs
      - name: Publish changed public cache without database scans
        if: steps.crawl.outputs.publish == 'true'
        run: |
          git config user.name "MFILM Catalog"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/seo/catalog.json public/sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish crawled public catalog"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
