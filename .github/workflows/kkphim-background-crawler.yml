name: KKPhim Background Crawler

on:
  schedule:
    # Poll only the admin's durable queue. No automatic bulk import without a request.
    - cron: '7-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: episode-cloud-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Continue requested crawl
        run: node scripts/crawlKkphim.mjs
