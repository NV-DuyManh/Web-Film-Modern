name: Auto Sync Episodes 24/7

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Kiểm tra mà không ghi dữ liệu'
        type: boolean
        default: false
      force:
        description: 'Bỏ qua thời gian chờ giữa hai lần chạy'
        type: boolean
        default: false

jobs:
  sync-episodes:
    env:
      CLOUD_WORKER_TOKEN: ${{ secrets.CLOUD_WORKER_TOKEN }}
      SECURE_ACCOUNTS_ENABLED: ${{ vars.SECURE_ACCOUNTS_ENABLED }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: episode-cloud-sync
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Episode Cloud Sync
        if: ${{ !cancelled() }}
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          node scripts/cloudSync.mjs "${args[@]}"
