name: Auto Sync Episodes 24/7

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên GitHub Actions nếu muốn

jobs:
  sync-episodes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: episode-cloud-sync
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Episode Cloud Sync
        run: node scripts/cloudSync.mjs
