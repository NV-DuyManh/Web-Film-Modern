name: Daily New KKPhim Movies

on:
  schedule:
    # 01:23 Vietnam time. The existing worker resumes unfinished daily imports.
    - cron: '23 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-new-movies:
    env:
      CLOUD_WORKER_TOKEN: ${{ secrets.CLOUD_WORKER_TOKEN }}
      SECURE_ACCOUNTS_ENABLED: ${{ vars.SECURE_ACCOUNTS_ENABLED }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: episode-cloud-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Queue daily discovery and continue available work
        id: crawl
        run: node scripts/crawlKkphim.mjs --daily
      - name: Publish imported films
        if: steps.crawl.outputs.publish == 'true'
        run: |
          git config user.name "MFILM Catalog"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/seo/catalog.json public/sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish daily new movies"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
