name: Daily Movie Catalog Maintenance

on:
  schedule:
    # 02:23 Vietnam time, once each day.
    - cron: '23 19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Kiểm tra mà không ghi dữ liệu'
        type: boolean
        default: false
      force:
        description: 'Chạy lại dù đã kiểm tra hôm nay'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  maintain-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: episode-cloud-sync
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Maintain Movie Catalog
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ "$DRY_RUN" != "true" ]; then args+=(--apply); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          node scripts/maintainMovieCatalog.mjs "${args[@]}"
      - name: Refresh public cache within the shared daily budget
        if: ${{ !cancelled() && inputs.dry_run != true }}
        continue-on-error: true
        run: npm run seo:refresh -- --budget
      - name: Publish refreshed public cache
        if: ${{ !cancelled() && inputs.dry_run != true }}
        run: |
          git config user.name "MFILM Catalog"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/seo/catalog.json public/sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh daily public catalog"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Notify search engines of recently updated public pages
        if: ${{ !cancelled() && inputs.dry_run != true }}
        run: npm run seo:submit -- --recent --submit
