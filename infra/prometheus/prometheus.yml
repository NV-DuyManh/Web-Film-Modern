global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'mfilm-backend'
    metrics_path: '/api/v1/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['backend:4000', 'host.docker.internal:4000']

  - job_name: 'clickhouse'
    scrape_interval: 10s
    static_configs:
      - targets: ['clickhouse:8001']
